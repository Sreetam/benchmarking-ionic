version: 0.2
# Static Ionic/Angular build. LEO's S3 "Deploy" pipeline stage extracts this
# build artifact directly into the frontend's S3 bucket root (CloudFront's
# DefaultRootObject is index.html), so the artifact's base-directory must be
# the build output (www/), not the repo root.
phases:
  install:
    commands:
      # CodeBuild's runtime-versions nodejs selector only offers older majors
      # than this Angular version requires (>=22.22.3), so install a current
      # Node via NodeSource instead.
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - node --version
  build:
    commands:
      - npm ci
      - npm run build
artifacts:
  base-directory: www
  files:
    - "**/*"
